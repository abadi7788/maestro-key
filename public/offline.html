<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#070b14" />
<title>غير متصل — مايسترو كي</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Cairo", "Segoe UI", Tahoma, Arial, sans-serif;
    background-color: #070b14;
    background-image:
      radial-gradient(ellipse 900px 520px at 100% -8%, rgba(47,123,255,.22), transparent 58%),
      radial-gradient(ellipse 720px 460px at 0% 110%, rgba(255,64,85,.12), transparent 55%);
    background-attachment: fixed;
    color: #e8eef8;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .glow-blue { position: fixed; top: -18%; right: -12%; width: 60vw; height: 60vw; max-width: 480px; max-height: 480px; border-radius: 50%; background: rgba(47,123,255,.16); filter: blur(110px); pointer-events: none; }
  .glow-red  { position: fixed; bottom: -20%; left: -10%; width: 55vw; height: 55vw; max-width: 440px; max-height: 440px; border-radius: 50%; background: rgba(255,64,85,.12); filter: blur(110px); pointer-events: none; }

  .card {
    position: relative;
    width: 100%;
    max-width: 420px;
    background: rgba(12, 20, 38, .72);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 28px;
    padding: 40px 28px 36px;
    text-align: center;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
    animation: rise .5s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: none; } }

  .logo-wrap { position: relative; width: 132px; height: 132px; margin: 0 auto 18px; }
  .logo-wrap::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; background: radial-gradient(circle, rgba(47,123,255,.35), rgba(255,64,85,.18) 70%, transparent); filter: blur(14px); }
  .logo { position: relative; width: 132px; height: 132px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(255,255,255,.15); box-shadow: 0 0 40px rgba(47,123,255,.45), 0 0 70px rgba(255,64,85,.2); }

  .brand { font-size: 11px; font-weight: 900; letter-spacing: .45em; color: #57c8ff; }
  .brand span { color: #ff4055; }
  h1 { margin-top: 6px; font-size: 30px; font-weight: 900; color: #fff; line-height: 1.1; }

  .divider { height: 1px; margin: 22px 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent); }

  .icon-wrap {
    width: 76px; height: 76px; margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 24px;
    background: rgba(255,64,85,.1);
    border: 1px solid rgba(255,64,85,.25);
    box-shadow: inset 0 0 24px rgba(255,64,85,.08);
  }
  .icon-wrap svg { width: 40px; height: 40px; stroke: #ff6b7f; }

  .title { font-size: 19px; font-weight: 900; color: #fff; }
  .desc { margin-top: 10px; font-size: 14px; font-weight: 600; line-height: 1.9; color: #9fb0c9; }

  .retry {
    margin-top: 26px;
    width: 100%;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    padding: 15px 20px;
    border: none; border-radius: 16px;
    background: linear-gradient(135deg, #2c6dff 0%, #174ea6 100%);
    color: #fff; font-family: inherit; font-size: 16px; font-weight: 900;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(47,123,255,.35), inset 0 1px 0 rgba(255,255,255,.2);
    transition: transform .15s ease, filter .15s ease, box-shadow .2s ease;
  }
  .retry:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 12px 30px rgba(47,123,255,.45); }
  .retry:active { transform: translateY(0) scale(.985); }
  .retry svg { width: 19px; height: 19px; stroke: #fff; transition: transform .5s ease; }
  .retry.spinning svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hint { margin-top: 16px; font-size: 12px; font-weight: 600; color: #6b7c96; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ff4055; margin-left: 6px; vertical-align: middle; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .4; transform: scale(.8);} 50% { opacity: 1; transform: scale(1.15);} }
</style>
</head>
<body>
  <div class="glow-blue"></div>
  <div class="glow-red"></div>

  <main class="card">
    <div class="logo-wrap">
      <img class="logo" src="/icons/icon-512x512.png" alt="مايسترو كي" onerror="this.src='/logo.png'" />
    </div>
    <p class="brand">MAESTRO <span>KEY</span></p>
    <h1>مايسترو كي</h1>

    <div class="divider"></div>

    <div class="icon-wrap" aria-hidden="true">
      <!-- Wifi-off icon (inline SVG) -->
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.55a11 11 0 0 1 5.17-2.39" />
        <path d="M1.42 9a16 16 0 0 1 4.08-2.9" />
        <path d="M22.58 9a16 16 0 0 0-4.08-2.9" />
        <path d="M19 12.55a11 11 0 0 0-5.17-2.39" />
        <path d="M12 20h.01" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <line x1="2" y1="2" x2="22" y2="22" />
      </svg>
    </div>

    <p class="title">غير متصل بالإنترنت</p>
    <p class="desc">يبدو أنك غير متصل بالإنترنت، يرجى التحقق من الشبكة وإعادة المحاولة.</p>

    <button class="retry" id="retryBtn" type="button">
      <!-- Refresh icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36" />
        <polyline points="21 3 21 9 15 9" />
      </svg>
      <span>إعادة المحاولة</span>
    </button>

    <p class="hint"><span class="dot"></span>جاري الانتظار لإعادة الاتصال…</p>
  </main>

<script>
  (function () {
    var btn = document.getElementById("retryBtn");
    btn.addEventListener("click", function () {
      btn.classList.add("spinning");
      btn.querySelector("span").textContent = "جارٍ الاتصال…";
      // إن عاد الاتصال → أعد تحميل التطبيق، وإلا fallback لصفحة offline بعد لحظات
      var done = false;
      var finish = function (online) {
        if (done) return; done = true;
        if (online) { window.location.replace("/sale"); }
        else { window.location.reload(); }
      };
      if (navigator.onLine) { finish(true); }
      else {
        var t = setTimeout(function () { finish(navigator.onLine); }, 2500);
        window.addEventListener("online", function () { clearTimeout(t); finish(true); });
      }
    });

    // إن عاد الاتصال تلقائياً → ارجع للتطبيق
    window.addEventListener("online", function () {
      window.location.replace("/sale");
    });
  })();
</script>
</body>
</html>
