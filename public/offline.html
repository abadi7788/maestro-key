  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#102c5b,transparent 55%),#050914;color:#eef5ff;font:16px/1.8 Tahoma,Arial,sans-serif}main{max-width:400px;width:100%;text-align:center;padding:32px 24px;border:1px solid #26354b;border-radius:28px;background:#0b1425}img{width:88px;height:88px;border-radius:22px}h1{font-size:22px;margin:18px 0 8px}p{color:#a5b6d1;margin:0 0 24px}button{width:100%;border:0;border-radius:14px;padding:15px;background:linear-gradient(90deg,#fa3f5f,#346bff);color:#fff;font:700 16px Tahoma,Arial;cursor:pointer}small{display:block;margin-top:20px;color:#8192ad}

<body>
  <main>
    <img src="/icons/icon-192x192.png" alt="Maestro Key">

    <button type="button" onclick="window.location.reload()">إعادة المحاولة</button>
    <small>Maestro Key — مايسترو كي</small>
