# maestro-key-build
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Android APK
        run: |
          mkdir -p public
          mkdir -p assets
          if [ -f icon.png ]; then
            cp icon.png assets/icon.png
          fi

          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Maestro Key</title>
            <style>
              body { margin: 0; background-color: #000000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; text-align: center; }
              .btn { background: #0070f3; color: #fff; border: none; padding: 12px 24px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-top: 15px; }
            </style>
          </head>
          <body>
            <h2>لا يوجد اتصال بالإنترنت</h2>
            <button class="btn" onclick="window.location.href='https://maestro-key.vercel.app'">إعادة المحاولة</button>
          </body>
          </html>
          EOF

          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap add android
          npx cap sync
          if [ -f assets/icon.png ]; then
            npx @capacitor/assets generate --android
          fi

          # تفعيل صلاحيات الإنترنت ومنع إعادة إنشاء النشاط عند العودة
          sed -i 's/android:launchMode="singleTop"/android:launchMode="singleTask"/' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/a \        android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' android/app/src/main/AndroidManifest.xml

          # برمجة زر الرجوع في أندرويد للرجوع داخل الموقع أو تصغير التطبيق بدلاً من الانهيار
          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java")
          cat << 'EOF' > "$MAIN_ACTIVITY"
          package com.maestrokey.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().getSettings().setDomStorageEnabled(true);
                      this.bridge.getWebView().getSettings().setDatabaseEnabled(true);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (this.bridge != null && this.bridge.getWebView() != null && this.bridge.getWebView().canGoBack()) {
                      this.bridge.getWebView().goBack();
                  } else {
                      moveTaskToBack(true);
                  }
              }
          }
          EOF

          cd android
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          cat << 'EOF' >> app/build.gradle
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF
          chmod +x gradlew
          ./gradlew assembleDebug -x lint -x test --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: maestro-key-app
          path: android/app/build/outputs/apk/debug/*.apk

