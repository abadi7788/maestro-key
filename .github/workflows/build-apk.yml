# maestro-key-build
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Android APK
        run: |
          mkdir -p public
          mkdir -p assets
          if [ -f icon.png ]; then
            cp icon.png assets/icon.png
          fi

          # إنشاء صفحة أوفلاين احترافية وبسيطة بنفس الثيم الأسود
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Maestro Key</title>
            <style>
              body {
                margin: 0;
                background-color: #0b0c10;
                color: #ffffff;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                font-family: system-ui, -apple-system, sans-serif;
                text-align: center;
              }
              .logo { width: 90px; height: 90px; margin-bottom: 20px; border-radius: 50%; }
              h2 { margin: 10px 0 5px; font-size: 20px; }
              p { color: #888; font-size: 14px; margin-bottom: 25px; }
              .btn {
                background: linear-gradient(90deg, #0070f3, #00dfd8);
                color: #fff;
                border: none;
                padding: 12px 28px;
                border-radius: 25px;
                font-size: 15px;
                font-weight: bold;
                cursor: pointer;
              }
            </style>
          </head>
          <body>
            <img src="icon.png" class="logo" alt="Logo" onerror="this.style.display='none'">
            <h2>لا يوجد اتصال بالإنترنت</h2>
            <p>يرجى التحقق من اتصال الشبكة والمحاولة مرة أخرى</p>
            <button class="btn" onclick="window.location.href='https://maestro-key.vercel.app'">إعادة المحاولة</button>
            <script>
              // محاولة إعادة التوجيه التلقائي للموقع عند توفر النت
              window.addEventListener('online', () => {
                window.location.href = 'https://maestro-key.vercel.app';
              });
            </script>
          </body>
          </html>
          EOF

          if [ -f icon.png ]; then
            cp icon.png public/icon.png
          fi

          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap add android
          npx cap sync
          if [ -f assets/icon.png ]; then
            npx @capacitor/assets generate --android
          fi

          # ضبط إعدادات أندرويد لعدم قتل الصفحة والاحتفاظ بها في الخلفية
          sed -i 's/android:launchMode="singleTop"/android:launchMode="singleTask"/' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/a \        android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' android/app/src/main/AndroidManifest.xml

          cd android
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          cat << 'EOF' >> app/build.gradle
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF
          chmod +x gradlew
          ./gradlew assembleDebug -x lint -x test --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: maestro-key-app
          path: android/app/build/outputs/apk/debug/*.apk
